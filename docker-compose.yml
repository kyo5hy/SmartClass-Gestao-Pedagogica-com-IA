services:
  frontend:
    image: nginx:alpine
    container_name: smartclass_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

  node_api:
    build: ./node_api
    container_name: smartclass_node
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  python_api:
    build: ./python_ia
    container_name: smartclass_python
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./yolov8n_ncnn_model:/app/python_ia/yolov8n_ncnn_model
      - ./yolov8n-face_ncnn_model:/app/python_ia/yolov8n-face_ncnn_model
      - ./yolov8n-pose_ncnn_model:/app/python_ia/yolov8n-pose_ncnn_model
      - ./python_ia/yolov8n.pt:/app/python_ia/yolov8n.pt
      - ./python_ia/yolov8n-face.pt:/app/python_ia/yolov8n-face.pt
      - ./python_ia/yolov8n-pose.pt:/app/python_ia/yolov8n-pose.pt
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 3G